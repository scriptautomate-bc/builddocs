# Workflow for building and deploying a Hugo site to GitHub Pages
name: Build and Deploy Sphinx site for support Salt ref docs to pages

on:
  # Builds + deploys. branches: ['*'] previously here never actually matched
  # slash-containing branch names (GitHub Actions branch globs treat '*' as
  # "no slashes"), so only merges to main ever triggered a run in practice --
  # made explicit here since that's genuinely the only ref that should build.
  push:
    branches:
      - main

  # Validates every contributor's PR -- including from forks -- without
  # requiring branch-name gymnastics. Runs with a read-only, secret-less
  # token when opened from a fork (GitHub's default for `pull_request`, as
  # opposed to `pull_request_target`), so it's safe to leave unrestricted.
  # The deploy job still only ever fires on `refs/heads/main`, which a PR's
  # ref never is, so this can't trigger an accidental Pages deploy.
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Reads docs_targets.json and derives the per-target build matrix plus the
  # current latest major version. Every other job is driven off this one --
  # adding/retiring a Salt release is a docs_targets.json edit, not a
  # workflow edit.
  compute-targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      latest_major: ${{ steps.targets.outputs.latest_major }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute targets
        id: targets
        run: |
          echo "matrix=$(python3 docs_targets.py matrix)" >> "$GITHUB_OUTPUT"
          echo "latest_major=$(python3 docs_targets.py latest-major)" >> "$GITHUB_OUTPUT"

  html:
    needs: compute-targets
    strategy:
      matrix:
        target: ${{ fromJson(needs.compute-targets.outputs.matrix) }}
    runs-on: ubuntu-24.04
    container: ghcr.io/saltstack/salt-ci-containers/builddocs:latest
    env:
      WEBSITE_RELEASE: ${{ matrix.target.website_release }}
      WEBSITE_POINT_RELEASE: ${{ matrix.target.website_point_release }}
      RELEASE_VERSION: ${{ matrix.target.release_version }}
      DOC_BRANCH: ${{ matrix.target.html_doc_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build docs from release tarball
        if: matrix.target.release_version != null
        run: ./build_html_release.sh
      - name: Checkout and prep Salt
        if: matrix.target.release_version == null
        run: |
          git clone --filter=blob:none -b "${DOC_BRANCH}" https://github.com/saltstack/salt
          sed -i "s:^cffi==.*::g" salt/requirements/static/pkg/py3.10/linux.lock
          sed -i "s:^contextvars==.*::g" salt/requirements/static/pkg/py3.10/linux.lock
          sed -i "s:^immutables==.*::g" salt/requirements/static/pkg/py3.10/linux.lock
          sed -i "s:^rpm-vercmp==.*::g" salt/requirements/static/pkg/py3.10/linux.lock
      - name: Install Python prereqs
        if: matrix.target.release_version == null
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -U pip setuptools wheel
          pip install -r salt/requirements/static/ci/py3.10/docs.lock && pip install -r salt/requirements/static/pkg/py3.10/linux.lock
          pip install jaraco.text==3.14.0
      - name: Build docs from source
        if: matrix.target.release_version == null
        run: |
          source venv/bin/activate
          ./build_html.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.website_release }}-html
          path: ./public/
          if-no-files-found: error
          retention-days: 1

  # PDFs have no release asset, so every target always builds from source,
  # regardless of how its HTML was produced.
  pdf:
    needs: compute-targets
    strategy:
      matrix:
        target: ${{ fromJson(needs.compute-targets.outputs.matrix) }}
    runs-on: ubuntu-24.04
    container: ghcr.io/saltstack/salt-ci-containers/builddocs:latest
    env:
      WEBSITE_RELEASE: ${{ matrix.target.website_release }}
      WEBSITE_POINT_RELEASE: ${{ matrix.target.website_point_release }}
      DOC_BRANCH: ${{ matrix.target.pdf_doc_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Checkout and prep Salt
        run: |
          git clone --depth 1 -b "${DOC_BRANCH}" https://github.com/saltstack/salt
          sed -i "s:^cffi==.*::g" salt/requirements/static/pkg/py3.10/linux.lock
          sed -i "s:^contextvars==.*::g" salt/requirements/static/pkg/py3.10/linux.lock
          sed -i "s:^immutables==.*::g" salt/requirements/static/pkg/py3.10/linux.lock
          sed -i "s:^rpm-vercmp==.*::g" salt/requirements/static/pkg/py3.10/linux.lock
      - name: Install Python prereqs
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -U pip setuptools wheel
          pip install -r salt/requirements/static/ci/py3.10/docs.lock && pip install -r salt/requirements/static/pkg/py3.10/linux.lock
          pip install jaraco.text==3.14.0
      - name: Build docs
        run: |
          source venv/bin/activate
          ./build_pdf.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.website_release }}-pdf
          path: ./public/
          if-no-files-found: error
          retention-days: 1

  single-tarball-site-archive:
    runs-on: ubuntu-24.04
    needs:
      - compute-targets
      - html
      - pdf
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Display all downloaded archives/artifacts
        run: |
          ls -lah

          echo "
          Listing *html/*..."
          ls -lah *html/*

          echo "
          Listing *pdf/*..."
          ls -lah *pdf/*
      - name: Create and populate docs-saltproject-io directory structure
        run: |
          echo "
          Creating docs-saltproject-io directory structure..."
          mkdir -p docs-saltproject-io/en
          mkdir -p docs-saltproject-io/en/pdf
          mkdir -p docs-saltproject-io/salt/install-guide/en
          mkdir -p docs-saltproject-io/salt/user-guide/en
          echo '<meta http-equiv="refresh" content="0; url=en/latest/contents.html" />' > docs-saltproject-io/index.html
          echo '<meta http-equiv="refresh" content="0; url=latest/contents.html" />' > docs-saltproject-io/en/index.html
          echo '<meta http-equiv="refresh" content="0; url=en/latest/index.html" />' > docs-saltproject-io/salt/install-guide/index.html
          echo '<meta http-equiv="refresh" content="0; url=latest/index.html" />' > docs-saltproject-io/salt/install-guide/en/index.html
          echo '<meta http-equiv="refresh" content="0; url=en/latest/index.html" />' > docs-saltproject-io/salt/user-guide/index.html
          echo '<meta http-equiv="refresh" content="0; url=latest/index.html" />' > docs-saltproject-io/salt/user-guide/en/index.html

          echo "
          Moving built docs to expected docs file paths..."
          mv *-html/* docs-saltproject-io/en/
          mv *-pdf/pdf/* docs-saltproject-io/en/pdf/
      - name: Create en/latest as a rewritten copy of the newest major release
        run: |
          LATEST_MAJOR="${{ needs.compute-targets.outputs.latest_major }}"
          rm -rf docs-saltproject-io/en/latest
          cp -a "docs-saltproject-io/en/${LATEST_MAJOR}" docs-saltproject-io/en/latest
          grep -rl "/en/${LATEST_MAJOR}/" docs-saltproject-io/en/latest | xargs -r \
            sed -i "s#/en/${LATEST_MAJOR}/#/en/latest/#g"
      - name: Download salt-install-guide and salt-user-guide
        run: |
          touch checksums.txt
          curl -o salt-install-guide.tar.gz -fsSL https://github.com/saltstack/salt-install-guide/releases/latest/download/salt-install-guide.tar.gz
          curl -fsSL https://github.com/saltstack/salt-install-guide/releases/latest/download/checksums.txt | tee --append checksums.txt
          curl -o salt-user-guide.tar.gz -fsSL https://github.com/saltstack/salt-user-guide/releases/latest/download/salt-user-guide.tar.gz
          curl -fsSL https://github.com/saltstack/salt-user-guide/releases/latest/download/checksums.txt | tee --append checksums.txt
          sha512sum -c checksums.txt --ignore-missing

          tar xvf salt-install-guide.tar.gz
          tar xvf salt-user-guide.tar.gz
          mv salt-install-guide docs-saltproject-io/salt/install-guide/en/latest
          mv salt-user-guide docs-saltproject-io/salt/user-guide/en/latest
      - name: Generate root sitemap index
        run: |
          # shellcheck disable=SC2046
          python3 gen_sitemap_index.py docs-saltproject-io $(python3 docs_targets.py sitemap-majors)
      - name: Generate robots.txt
        run: |
          {
            echo "User-agent: *"
            echo "Allow: /"
            python3 docs_targets.py robots-disallow | while read -r major; do
              echo "Disallow: /en/${major}/"
            done
            echo "Sitemap: https://docs.saltproject.io/sitemap.xml"
          } > docs-saltproject-io/robots.txt
      - name: Create tarball of docs
        run: |
          tar cvzf docs-saltproject-io.tar.gz docs-saltproject-io
      - name: Upload docs-saltproject-io.tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: docs-saltproject-io
          path: docs-saltproject-io.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload docs-saltproject-io for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: ./docs-saltproject-io

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs:
      - single-tarball-site-archive
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
